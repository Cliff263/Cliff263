<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><text y="9" fill="#edf4ff" font-size="44" font-weight="800" letter-spacing="2">CJ</text><text y="33" fill="#90a9cb" font-size="12" font-weight="700" letter-spacing="4">SYSTEMS</text></g>
<path d="M-135 0H-111 M111 0H135 M0 -135V-111 M0 111V135" stroke="#52dce5" stroke-width="1.2" opacity=".6"/>
</g>
<g font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#9beaf4"><text x="686" y="39">ENGINEERING / IN MOTION</text><text x="701" y="329" fill="#aaa7db">BUILD · AUTOMATE · SECURE</text></g>
