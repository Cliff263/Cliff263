<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">Takunda Cliff Jaure — Software Engineer, Product Development and Cloud Infrastructure</title>
<desc id="desc">A futuristic midnight-blue banner with animated neon cyan and purple orbital graphics, featuring Takunda Cliff Jaure in Harare, Zimbabwe.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080e23"/><stop offset=".52" stop-color="#111634"/><stop offset="1" stop-color="#080f22"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#44e9f4"/><stop offset=".52" stop-color="#9183ff"/><stop offset="1" stop-color="#ee8ad4"/></linearGradient>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172746" stop-opacity=".75"/><stop offset="1" stop-color="#10162f" stop-opacity=".22"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#6e61dd" stop-opacity=".32"/><stop offset="1" stop-color="#6e61dd" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7c8abc" stroke-opacity=".14" stroke-width=".7"/></pattern>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
<clipPath id="clip"><rect x="3" y="3" width="994" height="344" rx="22"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect x="3" y="3" width="994" height="344" rx="22" fill="url(#bg)"/>
<rect width="1000" height="350" fill="url(#grid)"/>
<circle cx="815" cy="172" r="230" fill="url(#aura)"/>
<path d="M0 282H1000 M0 313H1000" stroke="#485a97" opacity=".15"/>
<path d="M0 4H1000" stroke="url(#neon)" stroke-width="5"/>
<path d="M-160 4H85" stroke="#ffffff" stroke-width="5" opacity=".75"><animate attributeName="d" values="M-180 4H-30;M1000 4H1150" dur="6s" repeatCount="indefinite"/></path>
<g opacity=".55"><path d="M25 48V27H46 M975 48V27H954 M25 304V325H46 M975 304V325H954" fill="none" stroke="#56cced" stroke-width="1.3"/></g>
<g font-family="Segoe UI,Arial,sans-serif" fill="#ebf4ff">
<circle cx="62" cy="46" r="5" fill="#48f5c8"><animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/></circle>
