<text x="56" y="126" font-size="56" font-weight="800" letter-spacing="1">TAKUNDA</text>
<text x="56" y="193" font-size="60" font-weight="800" letter-spacing=".8">CLIFF <tspan fill="#64eaf3">JAURE</tspan></text>
<rect x="56" y="209" width="535" height="2" rx="2" fill="url(#neon)"/>
<text x="56" y="247" font-size="20" font-weight="600" fill="#d8ddfd">SOFTWARE ENGINEER <tspan fill="#54e9f5">//</tspan> PRODUCT BUILDER</text>
<text x="56" y="278" font-size="17" fill="#a6b5d7">Full-stack · Cloud / DevOps · AI integration · Security</text>
<g font-size="12" font-weight="700" letter-spacing="1.5"><rect x="56" y="298" rx="12" width="202" height="28" fill="#17263d" stroke="#39cbe2" stroke-opacity=".55"/><text x="72" y="317" fill="#a9e8ef">HARARE, ZIMBABWE</text><rect x="269" y="298" rx="12" width="226" height="28" fill="#22203d" stroke="#9e7df6" stroke-opacity=".5"/><text x="287" y="317" fill="#d0c2ff">RESEARCH → SHIP</text></g>
</g>
<g transform="translate(818 175)">
<circle r="121" fill="#142340" opacity=".28"/>
<circle r="118" fill="none" stroke="#5fdcf1" stroke-opacity=".2" stroke-width="1" stroke-dasharray="3 9"/>
<circle r="99" fill="none" stroke="#7181cd" stroke-opacity=".6" stroke-width="1"/>
<circle r="87" fill="none" stroke="#7de4eb" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="4 12"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="30s" repeatCount="indefinite"/></circle>
<circle r="63" fill="url(#surface)" stroke="#8fa0da" stroke-opacity=".5" stroke-width="1.4"/>
<circle r="57" fill="none" stroke="#46e7ee" stroke-width=".7" opacity=".35"/>
